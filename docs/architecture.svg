<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 2 992 294" role="img" aria-labelledby="title desc">
  <title id="title">Hearthgate architecture</title>
  <desc id="desc">Visitors connect to the cloud edge on port 443. The edge passes the TCP stream, still encrypted, through a WireGuard tunnel that the home gateway dialled. The home gateway terminates TLS and routes to your apps. In the other direction, monitoring hubs at home pull from agents on the edge.</desc>
  <!-- Same layout as the wide drawing in hearthgate-site's src/components/Diagram.astro, restyled for a GitHub README:
       GitHub's neutral colours and system font, the site's ember accent, with text sized to stay readable when the image is scaled to README width. -->
  <style>
    svg {
      --text: #1f2328; --dim: #59636e; --edge-line: #818b98;
      --canvas: #ffffff; --subtle: #f6f8fa; --border: #d1d9e0;
      --accent: #b0440a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 16px;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --text: #f0f6fc; --dim: #9198a1; --edge-line: #656c76;
        --canvas: #0d1117; --subtle: #151b23; --border: #3d444d;
        --accent: #ffa458;
      }
    }
    text { fill: var(--text); }
    .frame { fill: var(--canvas); stroke: var(--border); }
    .label { font-size: 14px; font-weight: 600; fill: var(--dim); }
    .label.accent { fill: var(--accent); }
    .box { fill: var(--subtle); stroke-width: 1.5; }
    .box.edge { stroke: var(--edge-line); stroke-dasharray: 6 5; }
    .box.home { stroke: var(--accent); }
    .chip, .node { fill: var(--canvas); stroke: var(--border); stroke-width: 1.25; }
    .chip-title { font-weight: 600; }
    .chip-sub, .caption, .note { font-size: 13.5px; fill: var(--dim); }
    .tube { fill: var(--accent); fill-opacity: 0.08; stroke: var(--accent); stroke-opacity: 0.5; stroke-width: 1.25; stroke-dasharray: 2 4; }
    .tube-label { font-size: 13.5px; font-weight: 600; fill: var(--accent); }
    .hot { stroke: var(--accent); stroke-width: 2; }
    .hot-head { fill: var(--accent); }
    .note.hot-text { fill: var(--accent); }
    .cool { stroke: var(--dim); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .cool-head { fill: var(--dim); }
  </style>

  <rect class="frame" x="-15.5" y="2.5" width="991" height="293" rx="6"/>

  <!-- tunnel -->
  <rect class="tube" x="420" y="74" width="140" height="148" rx="6"/>
  <text class="tube-label" x="490" y="153" text-anchor="middle">WireGuard</text>
  <text class="note" x="490" y="251" text-anchor="middle">tunnel dialled</text>
  <text class="note" x="490" y="268" text-anchor="middle">from home</text>

  <!-- edge -->
  <text class="label" x="305" y="40" text-anchor="middle">Cloud edge · low trust</text>
  <rect class="box edge" x="190" y="56" width="230" height="212" rx="6"/>
  <rect class="chip" x="206" y="84" width="198" height="52" rx="6"/>
  <text class="chip-title" x="220" y="107">TCP passthrough</text>
  <text class="chip-sub" x="220" y="126">nginx stream, no TLS</text>
  <rect class="chip" x="206" y="160" width="198" height="52" rx="6"/>
  <text class="chip-title" x="220" y="183">Monitoring agents</text>
  <text class="chip-sub" x="220" y="202">reachable from home only</text>
  <text class="caption" x="305" y="246" text-anchor="middle">no certificates · no config</text>

  <!-- home -->
  <text class="label accent" x="675" y="40" text-anchor="middle">Home · high trust</text>
  <rect class="box home" x="560" y="56" width="230" height="212" rx="6"/>
  <rect class="chip" x="576" y="84" width="198" height="52" rx="6"/>
  <text class="chip-title" x="590" y="107">TLS and routing</text>
  <text class="chip-sub" x="590" y="126">Caddy, your certificates</text>
  <rect class="chip" x="576" y="160" width="198" height="52" rx="6"/>
  <text class="chip-title" x="590" y="183">Monitoring hubs</text>
  <text class="chip-sub" x="590" y="202">pull from the agents</text>
  <text class="caption" x="675" y="246" text-anchor="middle">keys · firewall · config</text>

  <!-- public path -->
  <rect class="node" x="14" y="88" width="104" height="44" rx="22"/>
  <text x="66" y="115.5" text-anchor="middle">Visitors</text>
  <text class="note" x="162" y="100" text-anchor="middle">:443</text>
  <line class="hot" x1="122" y1="110" x2="194" y2="110"/>
  <polygon class="hot-head" points="204,110 193,105 193,115"/>
  <line class="hot" x1="404" y1="110" x2="564" y2="110"/>
  <polygon class="hot-head" points="574,110 563,105 563,115"/>
  <text class="note hot-text" x="490" y="100" text-anchor="middle">ciphertext</text>
  <line class="hot" x1="774" y1="110" x2="830" y2="110"/>
  <polygon class="hot-head" points="840,110 829,105 829,115"/>
  <rect class="node" x="842" y="88" width="104" height="44" rx="22"/>
  <text x="894" y="115.5" text-anchor="middle">Your apps</text>

  <!-- monitoring path -->
  <line class="cool" x1="576" y1="186" x2="414" y2="186"/>
  <polygon class="cool-head" points="406,186 415,181.5 415,190.5"/>
  <text class="note" x="490" y="204" text-anchor="middle">home pulls</text>
</svg>
