# Hearthgate home stack. Save this file in a directory of its own, then run
# `docker compose run --rm ctl init` before `up`.
#
# The gateway's three containers share one network namespace: the WireGuard
# tunnel, Caddy (TLS and HTTP routing) and a stream proxy (hub-to-agent
# connections). Image references must match internal/render/render.go.
name: hearthgate

services:
  gateway:
    image: linuxserver/wireguard:1.0.20260223-r0-ls130@sha256:10db56ad834f94541307d5dfdbe87370e26d155bb341a5bf65789f970f24ab5c
    cap_add: [NET_ADMIN]
    environment:
      PUID: "${HEARTHGATE_PUID:-1000}"
      PGID: "${HEARTHGATE_PGID:-1000}"
      TZ: Etc/UTC
      # Changes whenever a generated file changes, so `up -d` recreates the gateway.
      HEARTHGATE_CONFIG_HASH: "${HEARTHGATE_CONFIG_HASH:-}"
    sysctls:
      net.ipv4.ip_forward: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./generated/home/wireguard:/config
    networks:
      dmz:
        ipv4_address: "${HEARTHGATE_DMZ_IP:-10.210.1.2}"
      mgmt:
        ipv4_address: "${HEARTHGATE_MGMT_IP:-10.210.2.2}"
    healthcheck:
      # Healthy only once the tunnel interface exists and the firewall is loaded.
      test: ["CMD-SHELL", "ip link show wg0 >/dev/null 2>&1 && iptables -S INPUT 2>/dev/null | grep -q -- '-P INPUT DROP'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_healthy
        restart: true
    environment:
      HEARTHGATE_CONFIG_HASH: "${HEARTHGATE_CONFIG_HASH:-}"
    volumes:
      - ./generated/home/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  stream:
    image: nginx:1.30.6-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_healthy
        restart: true
    environment:
      HEARTHGATE_CONFIG_HASH: "${HEARTHGATE_CONFIG_HASH:-}"
    volumes:
      - ./generated/home/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  # One-shot tool: docker compose run --rm ctl <init|apply|push|check|rotate>
  # The release workflow checks that this tag is the release being published.
  ctl:
    profiles: [tools]
    image: ghcr.io/xrvo/hearthgate:0.1.0
    working_dir: /work
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SSH_AUTH_SOCK: /ssh-agent
    volumes:
      - .:/work
      # Used by `push` and `check` to reach the edge. Keys are read, never written.
      - type: bind
        source: "${HEARTHGATE_SSH_DIR:-${HOME:-.}/.ssh}"
        target: /ssh
        read_only: true
        bind:
          create_host_path: false
      - "${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent"

networks:
  # Join from the home apps you publish.
  dmz:
    name: hearthgate-dmz
    ipam:
      config:
        - subnet: "${HEARTHGATE_DMZ_SUBNET:-10.210.1.0/24}"
  # Join from home monitoring hubs; they reach edge agents at gateway:<port>.
  mgmt:
    name: hearthgate-mgmt
    ipam:
      config:
        - subnet: "${HEARTHGATE_MGMT_SUBNET:-10.210.2.0/24}"

volumes:
  caddy-data:   # certificates and their private keys; these never leave home
  caddy-config:
