# Hearthgate home stack. Save this file in a directory of its own, then run
# `docker compose run --rm ctl init`.
name: hearthgate

# Every container runs this one image. To upgrade, replace this file with the
# new release's and run `docker compose run --rm ctl deploy`.
x-image: &image ghcr.io/xrvo/hearthgate:0.1.0

services:
  # The WireGuard tunnel and the firewall. The two services below share its
  # network, but not its privileges or its keys.
  gateway:
    image: *image
    command: tunnel
    cap_add: [NET_ADMIN]            # to create the tunnel and firewall inside this container
    sysctls:
      net.ipv4.ip_forward: "0"      # nothing is routed between the tunnel and your networks
    environment:
      HEARTHGATE_CONFIG_HASH: "${HEARTHGATE_CONFIG_HASH:-}"   # restarts the stack when the configuration changes
    volumes:
      - ./generated/home/tunnel:/etc/hearthgate:ro
    networks:
      dmz:
        ipv4_address: "${HEARTHGATE_DMZ_IP:-10.210.1.2}"
      mgmt:
        ipv4_address: "${HEARTHGATE_MGMT_IP:-10.210.2.2}"
    restart: unless-stopped

  # TLS and HTTP routing to the apps you publish.
  caddy:
    image: *image
    command: caddy
    network_mode: "service:gateway"
    depends_on: &after-gateway
      gateway:
        condition: service_healthy   # the firewall is loaded
        restart: true
    volumes:
      - ./generated/home/caddy:/etc/hearthgate:ro
      - caddy-data:/data
    restart: unless-stopped

  # Connections from your monitoring hubs to agents on the edge.
  stream:
    image: *image
    command: nginx
    network_mode: "service:gateway"
    depends_on: *after-gateway
    volumes:
      - ./generated/home/stream:/etc/hearthgate:ro
    restart: unless-stopped

  # One-shot tool: docker compose run --rm ctl <command>
  ctl:
    profiles: [tools]
    image: *image
    network_mode: bridge
    environment:
      HEARTHGATE_IMAGE: *image      # the edge runs the same image
      SSH_AUTH_SOCK: /ssh-agent
      HEARTHGATE_SSH_DIR_HOST: "${HEARTHGATE_SSH_DIR:-${HOME:-.}/.ssh}"
      NO_COLOR: "${NO_COLOR:-}"
    volumes:
      - .:/work
      # How ctl reaches the edge: your SSH keys, read-only, and your SSH agent.
      - "${HEARTHGATE_SSH_DIR:-${HOME:-.}/.ssh}:/ssh:ro"
      - "${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent"

# Each network hands out addresses to other containers only from its upper
# half, so an app that starts before the gateway cannot take the gateway's .2.
networks:
  # Join from the home apps you publish.
  dmz:
    name: hearthgate-dmz
    ipam:
      config:
        - subnet: "${HEARTHGATE_DMZ_SUBNET:-10.210.1.0/24}"
          ip_range: "${HEARTHGATE_DMZ_RANGE:-10.210.1.128/25}"
  # Join from home monitoring hubs; they reach edge agents at gateway:<port>.
  mgmt:
    name: hearthgate-mgmt
    ipam:
      config:
        - subnet: "${HEARTHGATE_MGMT_SUBNET:-10.210.2.0/24}"
          ip_range: "${HEARTHGATE_MGMT_RANGE:-10.210.2.128/25}"

volumes:
  caddy-data:   # certificates and their private keys; these never leave home
