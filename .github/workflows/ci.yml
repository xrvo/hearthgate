name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs these tests before publishing

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load WireGuard
        run: sudo modprobe wireguard
      - name: End-to-end test
        run: bash tests/e2e/run.sh
