name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs these tests before publishing

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # Both architectures a release publishes, each on a native runner: WireGuard
  # cannot be configured under emulation.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Load WireGuard
        run: sudo modprobe wireguard
      - name: End-to-end test
        run: bash tests/e2e/run.sh
