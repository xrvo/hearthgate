name: Release

# Pushing a tag like v0.1.0 publishes ghcr.io/<owner>/hearthgate:0.1.0, :0.1
# and :latest, then creates a GitHub release with docker-compose.yml attached.
# Pre-release tags (v0.2.0-rc.1) publish only their own version.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  # Users download docker-compose.yml from the release, so it must run the
  # image this release publishes. Bump the tag in it before tagging.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml names this release
        run: |
          want="x-image: &image ghcr.io/$GITHUB_REPOSITORY:${GITHUB_REF_NAME#v}"
          grep -qxF "$want" docker-compose.yml || {
            echo "::error file=docker-compose.yml::expected the line '$want'"
            exit 1
          }

  image:
    needs: [test, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `ctl version` prints the image tag (0.1.0), not the git tag (v0.1.0).
          build-args: VERSION=${{ steps.meta.outputs.version }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" docker-compose.yml --verify-tag --generate-notes $pre
